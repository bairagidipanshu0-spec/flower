<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>flower</title>
        <style>
            #p{
                width: 600px;
                height: 600px;
                margin: auto;
                position: relative;
                margin-top: 200px;
            }
            .common{
                width: 300px;
                height: 300px;
                position: absolute;
            }
            .c1{
                background-color: red;
                bottom: 0px;
                left: 0px;
                border-top-left-radius: 300px;
                border-bottom-right-radius: 300px;
            }
            .c2{
                background: blue;
                top: 0px;
                left: 0px;
                border-top-right-radius: 300px;
                border-bottom-left-radius: 300px;
            }
            .c3{
                background: green;
                top: 0px;
                right: 0px;
                border-top-left-radius: 300px;
                border-bottom-right-radius: 300px;
            }
            .c4{
                background: yellow;
                right: 0px;
                bottom: 0px;
                border-top-right-radius: 300px;
                border-bottom-left-radius: 300px;
            }
        </style>
    </head>
    <body>
        <div id="p">
            <div class="common c1 red"></div>
            <div class="common c2 blue"></div>
            <div class="common c3 green"></div>
            <div class="common c4 yellow"></div>
        </div>
    </body>
</html>
